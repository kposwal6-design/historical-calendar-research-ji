name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          unzip -q HistoricalCalendar_ProductionCV_v3.zip -d extracted
          cp -R extracted/. .
      - name: Fix JVM target
        run: |
          find . -name "build.gradle" -o -name "build.gradle.kts" | while read f; do
            sed -i 's/jvmTarget *= *["'\'']1\.8["'\'']/jvmTarget = "17"/g' "$f"
            sed -i 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' "$f"
            sed -i 's/sourceCompatibility *= *1\.8/sourceCompatibility = JavaVersion.VERSION_17/g' "$f"
            sed -i 's/targetCompatibility *= *1\.8/targetCompatibility = JavaVersion.VERSION_17/g' "$f"
            sed -i 's/sourceCompatibility *= *["'\'']1\.8["'\'']/sourceCompatibility = JavaVersion.VERSION_17/g' "$f"
            sed -i 's/targetCompatibility *= *["'\'']1\.8["'\'']/targetCompatibility = JavaVersion.VERSION_17/g' "$f"
          done
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: historical-calendar-apk
          path: app/build/outputs/apk/debug/app-debug.apk
